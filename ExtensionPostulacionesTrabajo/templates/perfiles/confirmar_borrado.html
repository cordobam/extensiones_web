{% extends "base.html" %}

{% block titulo %}{{ super() }} · Borrar perfil{% endblock %}

{% block contenido %}
<h1>Borrar perfil</h1>

<div class="aviso">
  <p>Vas a borrar <strong>{{ perfil.id }}</strong> ({{ perfil.nombre }}).</p>
  <p>Se borra de la base <em>y</em> el archivo <code>perfiles/{{ perfil.id }}.yml</code>. No se puede deshacer.</p>
</div>

<form method="post" action="/perfiles/{{ perfil.id }}/borrar">
  <div class="acciones-principales">
    <button class="btn-peligro" type="submit">Sí, borrar el perfil</button>
    <a class="btn-secundario" href="/perfiles">Cancelar</a>
  </div>
</form>
{% endblock %}
