# Catálogo canónico de skills.
#
# Cada entrada define un nombre canónico (como se muestra y como se guarda), una
# categoría, y los alias por los que esa skill aparece en las ofertas reales.
#
# Para agregar una skill nueva: agregala al final de su categoría y nada más. No
# hace falta tocar código, ni migración, ni la base.
#
# Dos reglas que el cargador valida al arrancar:
#
# 1. Una clave de alias no puede pertenecer a dos skills distintas. Si "spark"
#    aparece como alias de Apache Spark y de PySpark, el catálogo no carga. Es
#    preferible que falle al arrancar y no que el scoring más adelante devuelva
#    puntajes raros sin explicación.
#
# 2. La categoría tiene que estar en la lista `categorias` de este archivo.
#
# Una limitación conocida: las claves de un solo carácter no se indexan, porque
# producirían falsos positivos constantes. "R" como lenguaje está cargado con
# alias de varias letras ("r language", "lenguaje r") para poder detectarlo.
#
# Sobre las categorías de soporte y atención: hay skills que sirven para las dos
# (Zendesk, Freshdesk, Salesforce). Como `categoria` es un solo valor, cada una
# quedó donde más se usa en el mercado argentino, y el otro rubro la sigue
# detectando igual en las ofertas: la categoría sirve para agrupar y filtrar, no
# para detectar.

version: 1

