[project]
name = "radar-laboral"
version = "0.1.0"
description = "Radar de ofertas de empleo: scraper, matching por reglas y dashboard."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.10",
    "email-validator>=2.2",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "selectolax>=0.3",
    "jinja2>=3.1",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]
migraciones = [
    "alembic>=1.14",
]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
