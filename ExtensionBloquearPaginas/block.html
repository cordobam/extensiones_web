<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página bloqueada</title>
  <link rel="stylesheet" href="block.css">
</head>
<body>
  <main class="card">
    <img src="icons/icon-128.png" alt="" class="logo">
    <h1>Página bloqueada</h1>
    <p id="site" class="site"></p>
    <p class="message">Este sitio está en tu lista de bloqueos para que no te distraigas. Vuelve a lo importante.</p>
    <div class="actions">
      <button id="back" class="btn secondary">Volver atrás</button>
      <button id="remove" class="btn primary">Quitar de la lista y entrar</button>
    </div>
  </main>
  <script src="block.js"></script>
</body>
</html>
